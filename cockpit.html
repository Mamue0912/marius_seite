<title>Cockpit — Persönliches Taskboard</title>
<style>
  /* =========================================================
     Design-System — Apple-inspiriert, Dark-Mode-first
     Tokens: Farbe · Abstand · Radius · Elevation · Material
     ========================================================= */
  :root {
    color-scheme: dark;
    /* Flächen / Tiefe */
    --bg: #0a0a0c;
    --bg-grad:
      radial-gradient(1100px 720px at 12% -8%, #17171e 0%, rgba(23,23,30,0) 55%),
      radial-gradient(900px 640px at 102% -4%, #141319 0%, rgba(20,19,25,0) 52%),
      #0a0a0c;
    --surface: #161619;      /* Karten */
    --surface-2: #1c1c21;    /* Zellen / Wells in Karten */
    --raised: #202026;       /* leicht angehobene Elemente */
    --sunken: #101013;       /* Inputs */
    --glass: rgba(20,20,25,0.62);    /* Chrome-Material */
    --glass-2: rgba(28,28,34,0.72);  /* Overlays */
    /* Linien */
    --line: rgba(255,255,255,0.09);
    --line-2: rgba(255,255,255,0.055);
    --hair: rgba(255,255,255,0.08);
    /* Text */
    --ink: rgba(255,255,255,0.92);
    --ink-2: rgba(235,235,245,0.70);
    --muted: rgba(235,235,245,0.52);
    --faint: rgba(235,235,245,0.30);
    /* Akzent (Apple systemIndigo) */
    --accent: #5E5CE6;
    --accent-2: #7D7AFF;
    --accent-ink: #ABA9FF;
    --accent-soft: rgba(94,92,230,0.20);
    --accent-line: rgba(125,122,255,0.32);
    /* Semantisch (Apple System Dark) */
    --urgent: #FF453A; --urgent-soft: rgba(255,69,58,0.16);
    --high: #FF9F0A;   --high-soft: rgba(255,159,10,0.16);
    --mid: #0A84FF;    --mid-soft: rgba(10,132,255,0.16);
    --low: #30D158;    --low-soft: rgba(48,209,88,0.15);
    --ok: #30D158;
    /* Scrollbars */
    --scroll: rgba(235,235,245,0.18);
    --scroll-h: rgba(235,235,245,0.32);
    /* Elevation */
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.28);
    --shadow: 0 6px 22px rgba(0,0,0,0.38);
    --shadow-lg: 0 28px 80px rgba(0,0,0,0.62);
    --ring: 0 0 0 3.5px var(--accent-soft);
    --hi: inset 0 1px 0 rgba(255,255,255,0.06);   /* oberer Glanz auf Glas */
    /* Radius */
    --r-sm: 9px; --r: 12px; --r-lg: 16px; --r-xl: 22px;
    /* Material-Blur */
    --blur: saturate(170%) blur(24px);
    /* Typo */
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light;
      --bg: #f2f2f7; --bg-grad: #f2f2f7;
      --surface: #ffffff; --surface-2: #f5f5f7; --raised: #ffffff; --sunken: #ededf0;
      --glass: rgba(255,255,255,0.66); --glass-2: rgba(255,255,255,0.8);
      --line: rgba(0,0,0,0.09); --line-2: rgba(0,0,0,0.055); --hair: rgba(0,0,0,0.08);
      --ink: #1d1d1f; --ink-2: rgba(60,60,67,0.82); --muted: rgba(60,60,67,0.58); --faint: rgba(60,60,67,0.34);
      --accent: #5856D6; --accent-2: #5856D6; --accent-ink: #4A48C0; --accent-soft: rgba(88,86,214,0.12); --accent-line: rgba(88,86,214,0.28);
      --urgent: #FF3B30; --urgent-soft: rgba(255,59,48,0.10);
      --high: #FF9500; --high-soft: rgba(255,149,0,0.12);
      --mid: #007AFF; --mid-soft: rgba(0,122,255,0.10);
      --low: #34C759; --low-soft: rgba(52,199,89,0.12);
      --ok: #34C759;
      --scroll: rgba(0,0,0,0.22); --scroll-h: rgba(0,0,0,0.32);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow: 0 2px 10px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-lg: 0 22px 64px rgba(0,0,0,0.18);
      --hi: inset 0 1px 0 rgba(255,255,255,0.6);
    }
  }
  :root[data-theme="dark"] { color-scheme: dark;
    --bg: #0a0a0c;
    --bg-grad:
      radial-gradient(1100px 720px at 12% -8%, #17171e 0%, rgba(23,23,30,0) 55%),
      radial-gradient(900px 640px at 102% -4%, #141319 0%, rgba(20,19,25,0) 52%),
      #0a0a0c;
    --surface: #161619; --surface-2: #1c1c21; --raised: #202026; --sunken: #101013;
    --glass: rgba(20,20,25,0.62); --glass-2: rgba(28,28,34,0.72);
    --line: rgba(255,255,255,0.09); --line-2: rgba(255,255,255,0.055); --hair: rgba(255,255,255,0.08);
    --ink: rgba(255,255,255,0.92); --ink-2: rgba(235,235,245,0.70); --muted: rgba(235,235,245,0.52); --faint: rgba(235,235,245,0.30);
    --accent: #5E5CE6; --accent-2: #7D7AFF; --accent-ink: #ABA9FF; --accent-soft: rgba(94,92,230,0.20); --accent-line: rgba(125,122,255,0.32);
    --urgent: #FF453A; --urgent-soft: rgba(255,69,58,0.16);
    --high: #FF9F0A; --high-soft: rgba(255,159,10,0.16);
    --mid: #0A84FF; --mid-soft: rgba(10,132,255,0.16);
    --low: #30D158; --low-soft: rgba(48,209,88,0.15); --ok: #30D158;
    --scroll: rgba(235,235,245,0.18); --scroll-h: rgba(235,235,245,0.32);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.28);
    --shadow: 0 6px 22px rgba(0,0,0,0.38);
    --shadow-lg: 0 28px 80px rgba(0,0,0,0.62);
    --hi: inset 0 1px 0 rgba(255,255,255,0.06);
  }
  :root[data-theme="light"] { color-scheme: light;
    --bg: #f2f2f7; --bg-grad: #f2f2f7;
    --surface: #ffffff; --surface-2: #f5f5f7; --raised: #ffffff; --sunken: #ededf0;
    --glass: rgba(255,255,255,0.66); --glass-2: rgba(255,255,255,0.8);
    --line: rgba(0,0,0,0.09); --line-2: rgba(0,0,0,0.055); --hair: rgba(0,0,0,0.08);
    --ink: #1d1d1f; --ink-2: rgba(60,60,67,0.82); --muted: rgba(60,60,67,0.58); --faint: rgba(60,60,67,0.34);
    --accent: #5856D6; --accent-2: #5856D6; --accent-ink: #4A48C0; --accent-soft: rgba(88,86,214,0.12); --accent-line: rgba(88,86,214,0.28);
    --urgent: #FF3B30; --urgent-soft: rgba(255,59,48,0.10);
    --high: #FF9500; --high-soft: rgba(255,149,0,0.12);
    --mid: #007AFF; --mid-soft: rgba(0,122,255,0.10);
    --low: #34C759; --low-soft: rgba(52,199,89,0.12); --ok: #34C759;
    --scroll: rgba(0,0,0,0.22); --scroll-h: rgba(0,0,0,0.32);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow: 0 2px 10px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
    --shadow-lg: 0 22px 64px rgba(0,0,0,0.18);
    --hi: inset 0 1px 0 rgba(255,255,255,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  body {
    background: var(--bg-grad); background-attachment: fixed; color: var(--ink);
    font-family: var(--sans);
  }
  ::selection { background: var(--accent-soft); }

  /* Scrollbars — dezent, schlank, Dark-Mode-tauglich */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--scroll); border-radius: 999px;
    border: 3px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-h); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  .app {
    color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: grid; grid-template-columns: 260px 1fr; min-height: 100vh;
  }
  button { font-family: inherit; }
  a { color: var(--accent-ink); }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 18px 14px; gap: 4px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 6px 8px 16px; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(155deg, var(--accent-2), var(--accent) 55%, #8f5cf0);
    display: grid; place-items: center; box-shadow: 0 3px 10px rgba(94,92,230,0.4), var(--hi);
  }
  .brand .mark::after { content: ""; width: 12px; height: 12px; border-radius: 4px; border: 2px solid #fff; opacity: .95; }
  .brand b { font-size: 15px; font-weight: 640; letter-spacing: -.015em; }
  .brand small { display: block; color: var(--faint); font-size: 11px; font-weight: 500; margin-top: 0; letter-spacing: .01em; }

  .nav-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--faint); font-weight: 600; padding: 16px 8px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    border: 0; background: transparent; cursor: pointer;
    color: var(--ink-2); font-size: 13.5px; font-weight: 500;
    padding: 8px 10px; border-radius: 9px;
    transition: background-color .16s ease, color .16s ease;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 590; }
  .nav-item .ic { width: 17px; height: 17px; flex: none; opacity: .9; }
  .nav-item .count {
    margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums;
    background: var(--surface-2); color: var(--muted);
    min-width: 20px; text-align: center; padding: 1px 7px; border-radius: 999px; font-weight: 600;
  }
  .nav-item.active .count { background: var(--accent-soft); color: var(--accent-ink); }

  .filt-group { padding: 4px 4px 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--ink-2); font-size: 12px; font-weight: 500;
    padding: 5px 10px; border-radius: 999px; cursor: pointer; margin: 4px 4px 0 0;
    transition: border-color .16s, background-color .16s, color .16s;
  }
  .chip:hover { border-color: var(--accent-line); color: var(--ink); }
  .chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); font-weight: 590; }
  .chip .dotc { width: 8px; height: 8px; border-radius: 50%; }

  .sync-mini {
    margin-top: auto; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--surface-2); padding: 11px 12px; font-size: 11.5px; color: var(--muted);
  }
  .sync-mini .row { display: flex; align-items: center; gap: 8px; padding: 2.5px 0; }
  .sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .sdot.off { background: var(--faint); }
  .sdot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(48,209,88,0.16); }
  .sdot.err { background: var(--urgent); box-shadow: 0 0 0 3px rgba(255,69,58,0.16); }

  /* ---------- Main ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--line);
    padding: 13px 26px; display: flex; align-items: center; gap: 14px;
  }
  .topbar h2 { margin: 0; font-size: 19px; font-weight: 680; letter-spacing: -.022em; }
  .topbar .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .spacer { flex: 1; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--sunken); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; min-width: 190px;
    transition: border-color .16s, box-shadow .16s;
  }
  .search:focus-within { border-color: var(--accent-line); box-shadow: var(--ring); }
  .search input { border: 0; background: transparent; outline: none; color: var(--ink); font-size: 13px; width: 100%; }
  .search input::placeholder { color: var(--faint); }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--ink); font-size: 13px; font-weight: 550;
    padding: 8px 14px; border-radius: 10px; cursor: pointer;
    transition: border-color .16s, background-color .16s, transform .08s, box-shadow .16s;
  }
  .btn:hover { border-color: var(--accent-line); background: var(--raised); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 2px 10px rgba(94,92,230,0.35); }
  .btn-primary:hover { background: var(--accent-2); border-color: transparent; }
  .btn.icon { padding: 0; width: 38px; height: 38px; justify-content: center; }

  .content { padding: 22px 26px 72px; max-width: 1200px; width: 100%; }

  /* Demo/Status-Streifen */
  .demo-strip {
    display: flex; align-items: center; gap: 11px;
    background: var(--high-soft); border: 1px solid color-mix(in srgb, var(--high) 26%, transparent);
    color: var(--ink-2); border-radius: var(--r); padding: 10px 14px; font-size: 12.5px;
    margin-bottom: 20px;
  }
  .demo-strip b { color: var(--ink); font-weight: 590; }
  .demo-strip .tag {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    background: var(--high); color: #1a1206; padding: 3px 8px; border-radius: 6px; flex: none;
  }
  .demo-strip button {
    margin-left: auto; border: 0; background: transparent; color: var(--accent-ink);
    font-weight: 590; font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .demo-strip.real { background: var(--low-soft); border-color: color-mix(in srgb, var(--low) 28%, transparent); }
  .demo-strip.real .tag { background: var(--low); color: #052210; }

  .section-title { font-size: 13px; font-weight: 640; color: var(--ink); margin: 30px 2px 13px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .section-title:first-child { margin-top: 4px; }
  .section-title .hint { font-weight: 450; color: var(--faint); font-size: 12px; }

  /* Summary-Kacheln */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tile {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 16px 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  }
  .tile .k { font-size: 11.5px; color: var(--muted); font-weight: 550; display: flex; align-items: center; gap: 6px; }
  .tile .v { font-size: 30px; font-weight: 680; letter-spacing: -.03em; margin-top: 8px; font-variant-numeric: tabular-nums; line-height: 1; }
  .tile .cap { font-size: 11.5px; color: var(--faint); margin-top: 7px; }
  .tile.alert .v { color: var(--urgent); }
  .tile.warn .v { color: var(--high); }
  .tile .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 3px 3px 0; }
  .tile.alert .stripe { background: var(--urgent); }
  .tile.warn .stripe { background: var(--high); }
  .tile.info .stripe { background: var(--accent); }

  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }

  /* Fokus */
  .focus-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 6px; box-shadow: var(--shadow-sm); }
  .focus-item { display: flex; gap: 13px; padding: 14px 13px; border-radius: var(--r); cursor: pointer; transition: background-color .16s; }
  .focus-item:hover { background: var(--surface-2); }
  .focus-item + .focus-item { border-top: 1px solid var(--line-2); }
  .focus-rank { font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); width: 23px; height: 23px; border-radius: 7px; display: grid; place-items: center; flex: none; margin-top: 1px; box-shadow: var(--hi); }
  .focus-body { min-width: 0; flex: 1; }
  .focus-body .t { font-size: 14px; font-weight: 590; letter-spacing: -.01em; }
  .focus-body .why { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .focus-meta { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; align-items: center; }

  /* generisches Listen-Panel */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .panel .ph { padding: 13px 16px; border-bottom: 1px solid var(--line-2); font-size: 12.5px; font-weight: 640; display: flex; align-items: center; justify-content: space-between; }
  .mini-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; cursor: pointer; transition: background-color .16s; }
  .mini-row:hover { background: var(--surface-2); }
  .mini-row + .mini-row { border-top: 1px solid var(--line-2); }
  .mini-when { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 60px; font-weight: 600; padding-top: 1px; }
  .mini-when .rel { color: var(--faint); font-weight: 500; display: block; font-size: 10.5px; }
  .mini-main { min-width: 0; flex: 1; }
  .mini-main .t { font-size: 13.5px; font-weight: 540; }
  .mini-main .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 640; padding: 3px 9px; border-radius: 999px; letter-spacing: .005em; white-space: nowrap; }
  .badge .d { width: 6px; height: 6px; border-radius: 50%; }
  .prio-dringend { background: var(--urgent-soft); color: var(--urgent); }
  .prio-dringend .d { background: var(--urgent); }
  .prio-hoch { background: var(--high-soft); color: var(--high); }
  .prio-hoch .d { background: var(--high); }
  .prio-mittel { background: var(--mid-soft); color: var(--mid); }
  .prio-mittel .d { background: var(--mid); }
  .prio-niedrig { background: var(--low-soft); color: var(--low); }
  .prio-niedrig .d { background: var(--low); }
  .src { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; background: var(--surface-2); }
  .src .sq { width: 7px; height: 7px; border-radius: 2.5px; }
  .src-reminders .sq { background: #FF9F0A; } .src-notes .sq { background: #FFD60A; }
  .src-outlook .sq { background: #0A84FF; } .src-calendar .sq { background: #5E5CE6; }
  .src-manual .sq { background: var(--faint); }
  .src-web .sq { background: #FFD60A; } .src-icloud .sq { background: #64D2FF; }
  .due { font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .due.over { color: var(--urgent); }
  .due.today { color: var(--high); }

  /* ---------- Board ---------- */
  .board-wrap { overflow-x: auto; padding-bottom: 10px; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: 300px; gap: 16px; align-items: start; }
  .col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; max-height: 74vh; }
  .col.drop { outline: 2px dashed var(--accent-line); outline-offset: -2px; background: var(--accent-soft); }
  .col-h { display: flex; align-items: center; gap: 9px; padding: 12px 14px; position: sticky; top: 0; }
  .col-h .ct { font-size: 12.5px; font-weight: 640; }
  .col-h .cc { font-size: 11px; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 1px 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .col-h .cdot { width: 8px; height: 8px; border-radius: 3px; }
  .col-body { padding: 0 10px 11px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 12px 13px; cursor: grab; box-shadow: var(--shadow-sm);
    transition: border-color .16s, box-shadow .16s, transform .08s;
  }
  .card:hover { border-color: var(--accent-line); box-shadow: var(--shadow); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .45; }
  .card.over-due { box-shadow: inset 3px 0 0 var(--urgent), var(--shadow-sm); }
  .card .c-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .card .c-title { font-size: 13.5px; font-weight: 590; letter-spacing: -.01em; line-height: 1.32; }
  .card .c-desc { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.42; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    if (/(zug|flug|bahn|reise|hotel|airbnb|urlaub|fahrt|abflug|ankunft|transfer|paris|basel)/.test(s)) return "reisen";
    if (/(bank|steuer|rechnung|zahlung|konto|finanz|versicherung)/.test(s)) return "finanzen";

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function isAllDayEv(ev) { return !!(ev.start && ev.start.date && !ev.start.dateTime); }
  function parseGDate(part) { // "2026-07-29" oder "2026-07-29T00:00:00Z"

  }

    var t = new Date(); t.setHours(0, 0, 0, 0);

  // Google-Event -> Cockpit-Event
  function mapGEvent(ev, calId) {
    var allDay = isAllDayEv(ev);
    var start, end = null, endLabel = null, time = "00:00";
    if (allDay) {
      start = parseGDate(ev.start.date);
      if (ev.end && ev.end.date) {
        var e = parseGDate(ev.end.date); e.setDate(e.getDate() - 1); // Google-Enddatum ist exklusiv
        if (e > start) endLabel = "bis " + e.getDate() + ". " + MO[e.getMonth()];
      }

      start = new Date(ev.start.dateTime);
      time = pad2(start.getHours()) + ":" + pad2(start.getMinutes());
      if (ev.end && ev.end.dateTime) {
        var ed = new Date(ev.end.dateTime);
        end = pad2(ed.getHours()) + ":" + pad2(ed.getMinutes());
      }
    }
    return {
      id: "g_" + (ev.id || Math.random().toString(36).slice(2)),
      title: ev.summary || "(ohne Titel)",
      day: dayOffset(start), time: time, allDay: allDay, end: end, endLabel: endLabel,

  function loadCalendar() {
    if (!mcpAvailable()) { state.cal.status = "unavailable"; state.cal.error = null; render(); return; }
    state.cal.status = "loading"; render();
    window.claude.mcp.callTool(GCAL, "list_calendars", {}).then(function (res) {
      var cals = ((res && res.payload && res.payload.calendars) || [])
        .filter(function (c) { return c.id && c.id.indexOf("#holiday") < 0; });
      if (!cals.length) cals = [{ id: "primary", summary: "Kalender" }];
      state.cal.calendars = cals;
      var start = new Date(); start.setHours(0, 0, 0, 0);
      return Promise.all(cals.map(function (c) {
        return window.claude.mcp.callTool(GCAL, "list_events", {
          calendarId: c.id, startTime: start.toISOString(), orderBy: "startTime", pageSize: 50
        }).then(function (r) { return (r && r.payload && r.payload.events) || []; },
          function () { return []; });
      })).then(function (lists) {
        var out = [];
        lists.forEach(function (list, i) {
          list.forEach(function (ev) {
            if (ev.status === "cancelled") return;
            out.push(mapGEvent(ev, cals[i].id));
          });
        });
        var seen = {};
        out = out.filter(function (e) {
          var k = e.title.toLowerCase() + "|" + e.day + "|" + e.time + "|" + e.allDay;
          if (seen[k]) return false; seen[k] = true; return true;
        });
        state.events = out;
        state.cal.status = "live";
        state.cal.error = null;
        state.cal.updatedAt = new Date();
        render();
      });
    }).catch(function (err) {
      state.cal.status = "error";
      state.cal.error = (err && err.code) || "upstream_error";
      if (!state.events.length || (state.events[0] && state.events[0].live)) state.events = state.demoEvents.slice();
      render();
    });

  /* ---------- Board ---------- */
  function renderBoard(c) {
    var wrap = el("div", "board-wrap"); var board = el("div", "board");

      var items = sortTasks(visibleTasks().filter(function (t) { return t.status === col.k; }));
      var cEl = el("div", "col"); cEl.dataset.col = col.k;
      var h = el("div", "col-h");
      h.innerHTML = '<span class="cdot" style="background:' + col.c + '"></span><span class="ct">' + col.t + '</span><span class="cc">' + items.length + '</span>';
      cEl.appendChild(h);

      items.forEach(function (t) { body.appendChild(taskCard(t)); });
      // dnd
      cEl.addEventListener("dragover", function (e) { e.preventDefault(); cEl.classList.add("drop"); });
      cEl.addEventListener("dragleave", function () { cEl.classList.remove("drop"); });

        e.preventDefault(); cEl.classList.remove("drop");
        var id = e.dataTransfer.getData("text/plain"); moveTask(id, col.k);

  function taskCard(t) {
    var card = el("div", "card" + (t.status === "erledigt" ? " done" : "") + (t.due != null && t.due < 0 && t.status !== "erledigt" ? " over-due" : ""));
    card.draggable = true; card.dataset.id = t.id;
    var linked = "";
    if (t.email && getMail(t.email)) linked += '<span class="link-chip">E-Mail</span>';
    if (t.event && getEvent(t.event)) linked += '<span class="link-chip">Termin</span>';
    card.innerHTML =
      '<div class="c-top">' + prioBadge(t.prio) + srcBadge(t.src) + '</div>' +
      '<div class="c-title">' + esc(t.title) + '</div>' +
      (t.desc ? '<div class="c-desc">' + esc(t.desc) + '</div>' : '') +
      '<div class="c-foot"><span class="cat-tag">' + CATMAP[t.cat].label + '</span>' +
      (t.due != null ? '<span class="due ' + dueClass(t.due) + '">' + dueText(t.due) + '</span>' : '') +
      linked + (t.est ? '<span class="est">' + t.est + ' min</span>' : '') + '</div>';

  function getTask(id) { return state.tasks.filter(function (t) { return t.id === id; })[0]; }

  function getEvent(id) { return state.events.filter(function (e) { return e.id === id; })[0]; }

  function openDrawer(html, footer) {
    var d = $("#drawer");
    d.innerHTML = html + (footer ? '<div class="df">' + footer + '</div>' : '');
    d.classList.add("open"); d.setAttribute("aria-hidden", "false");
    $("#scrim").classList.add("open");
    var x = $(".x", d); if (x) x.onclick = closeDrawer;
    return d;
  }
  function closeDrawer() { $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("open"); }
  $("#scrim").onclick = closeDrawer;

  function field(label, val) { return '<div class="field"><div class="fl">' + label + '</div><div class="fv">' + val + '</div></div>'; }

  function openTask(id) {
    var t = getTask(id); if (!t) return;
    var mail = t.email ? getMail(t.email) : null;
    var ev = t.event ? getEvent(t.event) : null;
    var head = '<div class="dh"><div><div style="margin-bottom:8px;">' + prioBadge(t.prio) + ' ' + srcBadge(t.src) + '</div>' +

    var body = '<div class="db">';
    if (t.desc) body += field("Beschreibung", esc(t.desc));
    body += '<div class="field"><div class="fl">Status</div><div class="seg" id="segStatus">' +
      COLS.map(function (c) { return '<button data-col="' + c.k + '"' + (c.k === t.status ? ' class="sel"' : '') + '>' + c.t + '</button>'; }).join("") + '</div></div>';
    body += '<div class="field"><div class="fl">Priorität</div><div class="seg" id="segPrio">' +
      PRIOS.map(function (p) { return '<button data-p="' + p.k + '"' + (p.k === t.prio ? ' class="sel"' : '') + '>' + p.label + '</button>'; }).join("") + '</div></div>';
    body += field("Kategorie", CATMAP[t.cat].label);
    if (t.due != null) body += field("Fällig", '<span class="due ' + dueClass(t.due) + '">' + dueText(t.due) + '</span>' + (t.time ? ' · ' + t.time + ' Uhr' : ''));
    if (t.est) body += field("Geschätzter Aufwand", t.est + " Minuten");
    if (t.next) body += field("Nächster sinnvoller Schritt", esc(t.next));
    if (mail) body += field("Verknüpfte E-Mail", esc(mail.from) + ' – ' + esc(mail.subj) + ' <a href="#" data-open-mail="' + mail.id + '" style="color:var(--accent-ink);text-decoration:none;font-weight:600;">öffnen</a>');
    if (ev) body += field("Verknüpfter Termin", esc(ev.title) + ' (' + dueText(ev.day) + ', ' + ev.time + ' Uhr)');
    body += field("Datenquelle", srcBadge(t.src) + (t.src === "manual" ? '' : ' <span style="color:var(--faint);">· nur Beispieldaten</span>'));
    body += '</div>';
    var footer = '<button class="btn btn-primary" id="dDone">' + (t.status === "erledigt" ? "Wieder öffnen" : "Als erledigt markieren") + '</button>' +
      (t.src === "manual" ? '<button class="btn btn-danger" id="dDel">Löschen</button>' : '<button class="btn" disabled title="Nur mit ausdrücklicher Freigabe">In Quelle schreiben</button>');
    openDrawer(head + body, footer);

    $("#segStatus").querySelectorAll("button").forEach(function (b) { b.onclick = function () { t.status = b.dataset.col; if (t.status === "erledigt") t.done = true; persist(); render(); openTask(id); }; });
    $("#segPrio").querySelectorAll("button").forEach(function (b) { b.onclick = function () { t.prio = b.dataset.p; persist(); render(); openTask(id); }; });
    var dd = $("#dDone"); if (dd) dd.onclick = function () { t.status = t.status === "erledigt" ? "eingang" : "erledigt"; persist(); render(); toast(t.status === "erledigt" ? "Erledigt" : "Wieder geöffnet"); openTask(id); };
    var del = $("#dDel"); if (del) del.onclick = function () { state.tasks = state.tasks.filter(function (x) { return x.id !== id; }); persist(); render(); closeDrawer(); toast("Aufgabe gelöscht"); };
    var om = $("[data-open-mail]", $("#drawer")); if (om) om.onclick = function (e) { e.preventDefault(); openMail(om.dataset.openMail); };
  }

  function openMail(id) {
    var m = getMail(id); if (!m) return;
    var task = m.task ? getTask(m.task) : null;
    var head = '<div class="dh"><div><div style="margin-bottom:8px;">' + mailSrc(m) +
      (m.needsReply && !m.answered ? ' <span class="badge prio-hoch"><span class="d"></span>Antwort nötig</span>' : '') + '</div>' +
      '<h3>' + esc(m.subj) + '</h3><div style="color:var(--muted);font-size:12.5px;margin-top:5px;">' + esc(m.from) + ' · ' + esc(m.addr) + '</div></div>' +
      '<button class="x" aria-label="Schließen">✕</button></div>';
    var body = '<div class="db">';
    body += field("Eingegangen", esc(m.dateLabel) + ' Uhr');
    body += field("Zusammenfassung", esc(m.sum));
    if (m.deadlineLabel) body += field("Erkannte Frist", '<span class="due today">' + esc(m.deadlineLabel) + '</span>');
    body += field("Antwort erforderlich", m.needsReply ? (m.answered ? "Ja – bereits beantwortet" : "Ja") : "Nein");
    body += field("Empfohlene nächste Aktion", esc(m.action));
    body += field("Kategorie", CATMAP[m.cat] ? CATMAP[m.cat].label : m.cat);
    if (task) body += field("Verknüpfte Aufgabe", esc(task.title) + ' <a href="#" data-open-task="' + task.id + '" style="color:var(--accent-ink);text-decoration:none;font-weight:600;">öffnen</a>');
    body += '<div class="note" style="margin-top:4px;">Diese Nachricht wurde nur gelesen. Antworten, Weiterleiten, Löschen und Archivieren sind gesperrt und erfordern jeweils eine separate, ausdrückliche Freigabe.</div>';
    body += '</div>';
    var canTask = m.needsReply && !task;
    var footer =
      '<button class="btn" disabled title="Öffnen in der Mail-App außerhalb des Artefakts">In Mail-App öffnen</button>' +
      (canTask ? '<button class="btn btn-primary" id="mkTask">Aufgabe erstellen</button>' : '') +
      '<button class="btn" disabled title="Nur mit ausdrücklicher Freigabe">Antworten</button>';
    openDrawer(head + body, footer);
    var mk = $("#mkTask"); if (mk) mk.onclick = function () { createTaskFromMail(m); };
    var ot = $("[data-open-task]", $("#drawer")); if (ot) ot.onclick = function (e) { e.preventDefault(); openTask(ot.dataset.openTask); };
  }

  function createTaskFromMail(m) {
    // avoid duplicates
    var dup = state.tasks.filter(function (t) { return t.email === m.id; })[0];
    if (dup) { toast("Aufgabe existiert bereits"); openTask(dup.id); return; }
    var t = {
      id: "t" + Date.now(), title: m.action || ("Antworten: " + m.subj), desc: "Aus E-Mail von " + m.from,
      cat: m.cat || "sonstiges", prio: m.bucket === "sofort" ? "dringend" : (m.bucket === "heute" ? "hoch" : "mittel"),
      due: (m.bucket === "sofort" || m.bucket === "heute") ? 0 : null, time: null, est: 15, status: "eingang", src: "manual",
      next: m.action, email: m.id, event: null
    };
    state.tasks.push(t); m.task = t.id; persist(); render();
    toast("Aufgabe im Eingang erstellt"); openTask(t.id);
  }

  function openEvent(id) {
    var e = getEvent(id); if (!e) return;
    var task = e.task ? getTask(e.task) : null;
    var mail = e.email ? getMail(e.email) : null;
    var rem = e.day === 0 ? "heute" : (e.day === 1 ? "morgen" : "in " + e.day + " Tagen");
    var head = '<div class="dh"><div><div style="margin-bottom:8px;">' + srcBadge(e.type === "frist" ? "outlook" : "calendar") +
      (e.type === "frist" ? ' <span class="deadline-chip">Frist</span>' : '') + '</div><h3>' + esc(e.title) + '</h3></div><button class="x" aria-label="Schließen">✕</button></div>';
    var whenTxt = e.allDay
      ? (dueText(e.day) + ' · ganztägig' + (e.endLabel ? ' (' + esc(e.endLabel) + ')' : '') + ' <span style="color:var(--faint);">(' + rem + ')</span>')
      : (dueText(e.day) + ' · ' + e.time + (e.end ? '–' + e.end : '') + ' Uhr <span style="color:var(--faint);">(' + rem + ')</span>');
    var body = '<div class="db">';
    body += field("Wann", whenTxt);
    if (e.place) body += field(e.place.indexOf("Video") >= 0 || e.place.indexOf("Teams") >= 0 ? "Videolink" : "Ort", esc(e.place));
    body += field("Kategorie", CATMAP[e.cat].label);
    if (e.prep) body += field("Notwendige Vorbereitung", esc(e.prep));
    if (task) body += field("Zugehörige Aufgabe", esc(task.title) + ' <a href="#" data-open-task="' + task.id + '" style="color:var(--accent-ink);text-decoration:none;font-weight:600;">öffnen</a>');
    if (mail) body += field("Zugehörige E-Mail", esc(mail.from) + ' – ' + esc(mail.subj));
    if (e.live) body += field("Quelle", '<span class="src src-calendar"><span class="sq"></span>Google Kalender</span> <span style="color:var(--faint);">· live, nur gelesen</span>');
    body += field("Verbleibende Zeit", rem);
    body += '</div>';
    var footer = e.link
      ? '<a class="btn btn-primary" href="' + esc(e.link) + '" target="_blank" rel="noopener">Im Google Kalender öffnen</a>'
      : '<button class="btn" disabled title="Verbindung erforderlich">Im Kalender öffnen</button>';
    openDrawer(head + body, footer);
    var ot = $("[data-open-task]", $("#drawer")); if (ot) ot.onclick = function (ev) { ev.preventDefault(); openTask(ot.dataset.openTask); };
  }

  /* =========================================================
     Add modal
     ========================================================= */
  function fillSelect(sel, arr, valKey, labelKey) {
    sel.innerHTML = arr.map(function (o) { return '<option value="' + o[valKey] + '">' + o[labelKey] + '</option>'; }).join("");
  }
  function openModal() {
    fillSelect($("#m_cat"), CATS, "k", "label");
    fillSelect($("#m_prio"), PRIOS, "k", "label");
    fillSelect($("#m_status"), COLS.filter(function (c) { return c.k !== "erledigt"; }), "k", "t");
    $("#m_prio").value = "mittel"; $("#m_status").value = "eingang";
    $("#m_title").value = ""; $("#m_desc").value = ""; $("#m_due").value = "";
    $("#modal").classList.add("open"); setTimeout(function () { $("#m_title").focus(); }, 60);
  }
  function closeModal() { $("#modal").classList.remove("open"); }
  function saveModal() {
    var title = $("#m_title").value.trim(); if (!title) { $("#m_title").focus(); return; }
    var dueRaw = $("#m_due").value.trim();
    var t = {
      id: "t" + Date.now(), title: title, desc: $("#m_desc").value.trim(),
      cat: $("#m_cat").value, prio: $("#m_prio").value,
      due: dueRaw === "" ? null : parseInt(dueRaw, 10), time: null, est: null,
      status: $("#m_status").value, src: "manual", next: null, email: null, event: null
    };
    state.tasks.push(t); persist(); render(); closeModal(); toast("Aufgabe hinzugefügt");
  }

  /* =========================================================
     misc
     ========================================================= */
  var toastT;
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function applyTheme() {
    if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
  }

  /* ---------- wire up ---------- */
  $("#addBtn").onclick = openModal;
  $("#m_cancel").onclick = closeModal; $("#modalBg").onclick = closeModal; $("#m_save").onclick = saveModal;
  $("#m_title").addEventListener("keydown", function (e) { if (e.key === "Enter") saveModal(); });
  $("#search").addEventListener("input", function (e) { state.search = e.target.value; render(); });
  $("#syncBtn").onclick = function () {
    var b = $("#syncBtn"); b.style.transition = "transform .6s"; b.firstElementChild.style.transform = "rotate(360deg)";
    setTimeout(function () { b.firstElementChild.style.transform = ""; }, 600);
    if (mcpAvailable()) { loadCalendar(); toast("Kalender wird aktualisiert · E-Mails: Momentaufnahme vom " + SNAPSHOT); }
    else { toast("E-Mails: Momentaufnahme vom " + SNAPSHOT + " – Kalender ist nur in claude.ai live"); }
  };
  $("#themeBtn").onclick = function () {
    var dark = state.theme ? state.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    state.theme = dark ? "light" : "dark"; applyTheme(); persist();
  };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeDrawer(); closeModal(); } });

  /* ---------- init ---------- */
  restore(); applyTheme(); render(); loadCalendar();
})();
</script>
